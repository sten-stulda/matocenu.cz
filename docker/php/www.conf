[www]
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
clear_env = no
catch_workers_output = yes
decorate_workers_output = no

; Health check endpoint (docker-compose healthcheck via cgi-fcgi), not reachable through nginx.
ping.path = /fpm-ping
ping.response = pong
