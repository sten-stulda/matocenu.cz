# Canonical host: www → apex (Cloudflare tunnel forwards both hostnames here).
server {
    listen 80;
    server_name www.matocenu.cz;
    return 301 https://matocenu.cz$request_uri;
}

server {
    listen 80 default_server;
    server_name _;
    root /var/www/html/public;
    index index.php;
    client_max_body_size 24m;
    server_tokens off;

    # Cloudflare tunnel → docker proxy → nginx: trust the client IP sent by Cloudflare.
    real_ip_header CF-Connecting-IP;
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 172.16.0.0/12;

    add_header X-Content-Type-Options nosniff always;

    # While the app container restarts (deploy), show a Czech maintenance page with 503 instead of 502.
    error_page 502 504 =503 /maintenance.html;
    location = /maintenance.html {
        internal;
        root /usr/share/nginx/maintenance;
        add_header Retry-After 30 always;
        add_header Cache-Control "no-store" always;
    }

    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Prometheus scrapes over the internal monitoring network; requests that came
    # through Cloudflare (CF-Connecting-IP present) never reach the metrics endpoint.
    location = /metrics {
        if ($http_cf_connecting_ip) {
            return 404;
        }
        try_files $uri /index.php?$query_string;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        # Unique alias: "app" is ambiguous because web also joins the shared monitoring network.
        fastcgi_pass mtc-app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 60s;
    }

    location ~ /\.(?!well-known) { deny all; }
}
