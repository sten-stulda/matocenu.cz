name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pgsql, pdo_pgsql, redis, intl, zip, bcmath, gd
          coverage: none
      - run: composer install --no-interaction --no-progress --prefer-dist
      - name: Pint (formátování)
        run: vendor/bin/pint --test
      - name: Larastan (statická analýza)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G
      - name: Composer audit
        run: composer audit
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    runs-on: ubuntu-latest
    services:
      pgsql:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: matocenu_test
          POSTGRES_USER: matocenu
          POSTGRES_PASSWORD: matocenu
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U matocenu" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: matocenu
      DB_PASSWORD: matocenu
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pgsql, pdo_pgsql, redis, intl, zip, bcmath, gd
          coverage: none
      - run: composer install --no-interaction --no-progress --prefer-dist
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build assets
        run: npm ci --no-audit --no-fund && npm run build
      - run: cp .env.example .env && php artisan key:generate
      - name: Pest na PostgreSQL (AI jen přes FakeProvider)
        run: php artisan test

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker images
        run: |
          docker build -f docker/php/Dockerfile --target app -t matocenu-app:${{ github.sha }} .
          docker build -f docker/php/Dockerfile --target web -t matocenu-web:${{ github.sha }} .
